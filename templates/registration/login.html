{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
  <h1>Entrar no sistema</h1>

  {% if form.errors %}
    <p class="alerta" role="alert">Usuário ou senha inválidos. Tente novamente.</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}" class="formulario">
    {% csrf_token %}
    <div class="campo">
      <label for="{{ form.username.id_for_label }}">Usuário</label>
      <input type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="{{ form.password.id_for_label }}">Senha</label>
      <input type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
